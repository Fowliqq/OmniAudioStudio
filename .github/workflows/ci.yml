name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Test (.NET 8 Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore OmniAudioStudio.sln

    - name: Build Solution (Release)
      run: dotnet build OmniAudioStudio.sln -c Release --no-restore

    - name: Setup FFmpeg for Tests
      uses: FedericoCarboni/setup-ffmpeg@v3
      id: setup-ffmpeg
      with:
        ffmpeg-version: 'release'
        architecture: 'x64'

    - name: Run Test Suite
      run: dotnet run --project OmniAudioStudio.Tests/OmniAudioStudio.Tests.csproj -c Release --no-build
